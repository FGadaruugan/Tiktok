<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100b22">
<meta name="description" content="MiniTok — Neon video feed demo">
<title>MiniTok — Neon Edition</title>
<style>
:root{color-scheme:dark;--pink:#ff3b9d;--cyan:#31e7ff;--bg:#090812}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#24123d 0,#090812 55%);color:#fff;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:#fff;border:1px solid #ffffff25;background:#ffffff12;backdrop-filter:blur(14px);border-radius:14px;padding:10px 14px;transition:transform .18s,border-color .18s}button:active{transform:scale(.94)}button:hover{border-color:#ff3b9d99}.app{max-width:520px;margin:auto;min-height:100dvh;padding:14px 12px 94px}.top{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 16px}.logo{font-weight:950;font-size:25px;letter-spacing:-1.2px}.logo span{color:var(--cyan);text-shadow:2px 0 var(--pink)}.pill{border-radius:99px;background:linear-gradient(110deg,#ff3b9d,#a64dff);border:0;font-weight:750}.tabs{display:flex;justify-content:center;gap:20px;color:#aaa;margin-bottom:14px}.tabs strong{color:white;position:relative}.tabs strong:after{content:"";position:absolute;bottom:-8px;left:25%;width:50%;height:3px;border-radius:4px;background:linear-gradient(90deg,var(--pink),var(--cyan))}.feed{display:grid;gap:18px}.video-card{position:relative;overflow:hidden;min-height:480px;height:min(70dvh,720px);border:1px solid #ffffff20;border-radius:27px;background:linear-gradient(145deg,#30204a,#101321);box-shadow:0 18px 60px #0008;isolation:isolate}.video-card video{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;background:#171222}.video-card:after{content:"";position:absolute;inset:25% 0 0;background:linear-gradient(transparent,#080711e8);z-index:0;pointer-events:none}.video-card video:not([src]){display:none}.placeholder{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#ff3b9d55,transparent 35%),radial-gradient(circle at 70% 60%,#31e7ff55,transparent 35%),linear-gradient(145deg,#26143e,#0c1228);font-size:68px}.overlay{position:absolute;z-index:1;inset:auto 14px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.details{max-width:78%;text-shadow:0 2px 8px #000}.user{font-weight:800;margin-bottom:8px}.caption{margin:0 0 10px}.sound{font-size:12px;color:#e5d8ff}.actions{display:grid;gap:15px;text-align:center}.action{display:grid;gap:3px;justify-items:center;background:transparent;border:0;padding:3px;font-size:12px}.action .emoji{display:grid;place-items:center;width:46px;height:46px;border:1px solid #ffffff40;background:#ffffff20;backdrop-filter:blur(12px);border-radius:50%;font-size:21px}.action.liked .emoji{background:#ff3b9d38;border-color:var(--pink);animation:pop .24s}.progress{position:absolute;z-index:2;bottom:0;left:0;right:0;height:3px;background:#ffffff30}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--cyan))}@keyframes pop{50%{transform:scale(1.22)}}.upload-panel{margin:18px 0;padding:16px;border:1px solid #ffffff20;border-radius:22px;background:#ffffff08;backdrop-filter:blur(16px)}.upload-panel h2{font-size:17px;margin:0 0 10px}.upload-panel input,.upload-panel textarea{width:100%;margin:6px 0 10px;padding:12px;border-radius:12px;border:1px solid #ffffff24;background:#100d1d;color:white}.upload-panel textarea{resize:vertical;min-height:70px}.upload-panel .pill{width:100%;padding:12px}.nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;justify-content:space-around;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#0b0915dd;border-top:1px solid #ffffff18;backdrop-filter:blur(20px)}.nav button{border:0;background:transparent;font-size:12px;display:grid;gap:3px;justify-items:center}.nav b{font-size:20px}.empty{color:#b8aecb;text-align:center;padding:12px}@media(min-width:700px){.app{padding-top:22px}.video-card{height:680px}}@media(max-width:380px){.video-card{min-height:410px;height:65dvh}.logo{font-size:22px}.action .emoji{width:40px;height:40px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="logo">mini<span>tok</span> ✦</div><button class="pill" onclick="document.querySelector('#videoFile').click()">＋ Нийтлэх</button></header>
<div class="tabs"><span>Шууд</span><strong>Танд</strong><span>Дагаж буй</span></div>
<section id="feed" class="feed">
<article class="video-card">
<div class="placeholder">🎬</div>
<div class="overlay"><div class="details"><div class="user">@minitok_demo</div><p class="caption">MiniTok Neon Edition ✨ Өөрийн видеогоо нэмээд туршаарай!</p><div class="sound">♫ Original sound — MiniTok</div></div><div class="actions"><button class="action like" onclick="toggleLike(this)"><span class="emoji">♡</span><span class="count">128</span></button><button class="action" onclick="comment(this)"><span class="emoji">💬</span><span>Сэтгэгдэл</span></button><button class="action" onclick="shareVideo()"><span class="emoji">↗</span><span>Хуваалцах</span></button></div></div><div class="progress"><i></i></div>
</article>
</section>
<section class="upload-panel"><h2>＋ Өөрийн видео нэмэх</h2><input id="videoFile" type="file" accept="video/*"><input id="username" maxlength="30" placeholder="Хэрэглэгчийн нэр" value="my_video"><textarea id="caption" maxlength="180" placeholder="Видеоныхоо тайлбарыг бич..."></textarea><button class="pill" onclick="addVideo()">Видео feed-д нэмэх</button><p class="empty">Демо хувилбар: видеонууд зөвхөн энэ хөтчийн нээлттэй үед харагдана.</p></section>
</main>
<nav class="nav"><button onclick="window.scrollTo({top:0,behavior:'smooth'})"><b>⌂</b>Нүүр</button><button onclick="document.querySelector('#videoFile').click()"><b>＋</b>Нэмэх</button><button onclick="alert('Профайл хэсгийг дараагийн хувилбарт нэмнэ.')"><b>◎</b>Профайл</button></nav>
<script>
function toggleLike(btn){const liked=btn.classList.toggle('liked');btn.querySelector('.emoji').textContent=liked?'♥':'♡';const count=btn.querySelector('.count');count.textContent=Number(count.textContent)+(liked?1:-1)}
function comment(btn){const msg=prompt('Сэтгэгдлээ бичнэ үү:');if(msg&&msg.trim()){const n=document.createElement('span');n.textContent='✓ '+msg.trim();n.style.cssText='display:block;color:#d9c9ff;font-size:12px;margin-top:8px;overflow-wrap:anywhere';btn.closest('.video-card').querySelector('.details').append(n)}}
function shareVideo(){if(navigator.share)navigator.share({title:'MiniTok',text:'MiniTok дээрх видеог үзээрэй',url:location.href}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(location.href).then(()=>alert('Холбоос хууллаа!')).catch(()=>alert(location.href));else alert(location.href)}
function addVideo(){const file=document.querySelector('#videoFile').files[0];if(!file){alert('Эхлээд видео файл сонгоно уу.');return}if(!file.type.startsWith('video/')){alert('Видео файл сонгоно уу.');return}const url=URL.createObjectURL(file),name=document.querySelector('#username').value.trim()||'my_video',caption=document.querySelector('#caption').value.trim();const card=document.createElement('article');card.className='video-card';card.innerHTML='<video controls autoplay muted loop playsinline></video><div class="overlay"><div class="details"><div class="user"></div><p class="caption"></p><div class="sound">♫ Original sound</div></div><div class="actions"><button class="action like" onclick="toggleLike(this)"><span class="emoji">♡</span><span class="count">0</span></button><button class="action" onclick="comment(this)"><span class="emoji">💬</span><span>Сэтгэгдэл</span></button><button class="action" onclick="shareVideo()"><span class="emoji">↗</span><span>Хуваалцах</span></button></div></div><div class="progress"><i></i></div>';card.querySelector('video').src=url;card.querySelector('.user').textContent='@'+name.replace(/\s+/g,'_');card.querySelector('.caption').textContent=caption||'Шинэ видео ✨';document.querySelector('#feed').prepend(card);card.scrollIntoView({behavior:'smooth',block:'start'})}
document.addEventListener('click',e=>{const card=e.target.closest('.video-card');if(!card||e.target.closest('button,video'))return;const v=card.querySelector('video');if(v){v.paused?v.play().catch(()=>{}):v.pause()}});
document.addEventListener('timeupdate',e=>{if(e.target.tagName==='VIDEO'&&e.target.duration){const p=e.target.closest('.video-card')?.querySelector('.progress i');if(p)p.style.width=(e.target.currentTime/e.target.duration*100)+'%'}},true);
</script>
</body>
</html>
